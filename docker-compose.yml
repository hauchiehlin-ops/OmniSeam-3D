version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: omniseam_backend
    ports:
      - "8000:8000"
    environment:
      - UPLOAD_DIR=/tmp/omniseam/uploads
      - PROCESSED_DIR=/tmp/omniseam/processed
      - MAX_UPLOAD_SIZE_MB=500
    volumes:
      - omniseam_data:/tmp/omniseam
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: omniseam_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  omniseam_data:
