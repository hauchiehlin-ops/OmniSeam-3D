# Publishes site/ (privacy policy, support page, remote config.json) to
# GitHub Pages: https://hauchiehlin-ops.github.io/OmniSeam-3D/
# These URLs are used by App Store Connect and by the iOS app
# (src/platform/links.ts, remote-config.ts, StorePlugin.swift time check).
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions" (or: gh api -X POST repos/{owner}/{repo}/pages -f build_type=workflow).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check config.json is valid JSON
        run: python3 -m json.tool site/config.json > /dev/null
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
