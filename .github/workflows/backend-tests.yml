name: Backend tests

# Runs the backend suite on Python 3.10 (ZeroGPU Spaces) and 3.11 (CPU Spaces,
# Docker) for every PR, so problems surface before merging.
# Python 3.14 defers annotation evaluation, which hides errors such as a
# missing `typing` import that crash 3.11 at import time.

on:
  pull_request:
    paths:
      - "app.py"
      - "backend/**"
      - "requirements.txt"
      - "constraints.txt"
      - "packages.txt"
      - "README.md"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies
        run: pip install -r backend/requirements.txt -c constraints.txt pyflakes==3.2.0
      - name: Undefined names (pyflakes)
        run: python -m pyflakes app.py backend | grep "undefined name" && exit 1 || true
      - name: Tests
        run: PYTHONPATH=. pytest -q backend/tests
