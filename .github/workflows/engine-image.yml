name: Build engine image

# Builds the prebuilt OmniSeam engine image and pushes it to GitHub Container
# Registry. Hugging Face Spaces created from deploy/hf-space only pull this
# image, so a "Duplicate this Space" starts in minutes and never breaks
# because an upstream package changed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend tests (pinned dependencies)
        run: |
          pip install -r backend/requirements.txt -c constraints.txt
          PYTHONPATH=. pytest -q backend/tests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/omniseam-engine"
          VERSION="$(python -c "import json;print(json.load(open('package.json'))['version'])")"
          echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
