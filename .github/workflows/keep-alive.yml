name: Keep HF nodes awake

# Free Hugging Face Spaces sleep after ~48 hours without traffic and then take
# minutes to wake up. Pinging /api/v1/health regularly keeps the public demo
# node (and, during App Store review, the review node) warm.
#
# Optional repository variable (Settings → Secrets and variables → Actions → Variables):
#   REVIEW_NODE_URL   e.g. https://<you>-omniseam-review.hf.space
#   PING_EVERY_HOURS  not used by cron; edit the schedule below during review (e.g. every 2 hours)

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping public demo node
        run: |
          URL="https://hauchieh-omniseam-engine.hf.space/api/v1/health"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 60 "$URL" || true)
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ] && grep -q '"healthy"' /tmp/health.json; then cat /tmp/health.json; exit 0; fi
            sleep 60
          done
          echo "::warning::Public demo node did not report healthy"
      - name: Ping App Store review node
        if: ${{ vars.REVIEW_NODE_URL != '' }}
        run: |
          URL="${{ vars.REVIEW_NODE_URL }}/api/v1/health"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 60 "$URL" || true)
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ] && grep -q '"healthy"' /tmp/health.json; then cat /tmp/health.json; exit 0; fi
            sleep 60
          done
          echo "::error::Review node did not report healthy"
          exit 1
